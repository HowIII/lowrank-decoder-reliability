[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowrank-reliability"
version = "0.1.0"
description = "Per-prediction confidence scores, calibrated acceptance thresholds and decoder audits for perturbation-response models"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Zheyu Zhang" },
    { name = "Yuanhao Huang" },
    { name = "Fan Feng" },
    { name = "Jie Liu" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
]
keywords = ["perturbation prediction", "single-cell", "interpretability", "calibration", "learn-then-test"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
audit = ["torch>=2.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
